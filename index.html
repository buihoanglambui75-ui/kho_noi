<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khó Nói</title>
<style>
:root{--bg1:#fdf2f8;--bg2:#ede9fe;--text:#4c1d95;--accent:#db2777;--muted:#6b7280;--card:rgba(255,255,255,.7);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg1:#1e1b4b;--bg2:#4a044e;--text:#fce7f3;--accent:#f9a8d4;--muted:#d1d5db;--card:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg1:#1e1b4b;--bg2:#4a044e;--text:#fce7f3;--accent:#f9a8d4;--muted:#d1d5db;--card:rgba(255,255,255,.08)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--text);overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .8s ease,visibility .8s}
.hidden{opacity:0;visibility:hidden;pointer-events:none}
.lock{background:var(--card);padding:32px 28px;border-radius:20px;backdrop-filter:blur(8px);max-width:320px;width:100%;box-sizing:border-box}
.lock h2{margin:0 0 16px;font-weight:500}
input{width:100%;box-sizing:border-box;font-size:22px;letter-spacing:.5em;text-align:center;padding:12px;border-radius:12px;border:2px solid var(--accent);background:transparent;color:var(--text);outline:none}
button{margin-top:16px;width:100%;padding:12px;font-size:16px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
.err{height:20px;margin-top:10px;font-size:14px;color:#ef4444}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
h1{font-size:clamp(36px,10vw,88px);margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--accent);display:flex;flex-wrap:wrap;justify-content:center;gap:0 .3em}
.word{display:inline-flex}
.ch{display:inline-block;opacity:0;transform:translateY(40px) scale(.5);animation:pop .7s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
.sub{margin-top:24px;font-size:clamp(14px,3.5vw,18px);color:var(--muted);opacity:0;animation:fade 1.2s ease forwards}
@keyframes fade{to{opacity:1}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
</style>
</head>
<body>
<div class="screen" id="lock">
  <div class="lock" id="box">
    <h2>🔒 Nhập mật khẩu</h2>
    <input id="pw" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
    <button id="go">Mở</button>
    <div class="err" id="err"></div>
  </div>
</div>

<div class="screen hidden" id="wish">
  <h1 id="title" class="float"></h1>
  <p class="sub" id="sub">Chỉ muốn nói với cậu nhiêu đó thôi 💕</p>
</div>

<script>
const PASSWORD = "0310";
const pw = document.getElementById("pw"), err = document.getElementById("err"), box = document.getElementById("box");

function buildTitle(){
  const t = document.getElementById("title");
  t.innerHTML = "";
  let i = 0;
  "Tớ Thích Cậu".split(" ").forEach(w=>{
    const word = document.createElement("span"); word.className = "word";
    [...w].forEach(c=>{
      const s = document.createElement("span"); s.className = "ch"; s.textContent = c;
      s.style.animationDelay = (0.4 + i++ * 0.09) + "s";
      word.appendChild(s);
    });
    t.appendChild(word);
  });
  document.getElementById("sub").style.animationDelay = (0.4 + i * 0.09 + 0.5) + "s";
}

function check(){
  if (pw.value === PASSWORD){
    document.getElementById("lock").classList.add("hidden");
    buildTitle();
    document.getElementById("wish").classList.remove("hidden");
  } else {
    err.textContent = "Sai mật khẩu, thử lại nhé!";
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
    pw.value = ""; pw.focus();
  }
}
document.getElementById("go").addEventListener("click", check);
pw.addEventListener("keydown", e=>{ if(e.key === "Enter") check(); });
pw.focus();
</script>
</body>
</html>
